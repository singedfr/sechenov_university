<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Анализ для врача | ИИ-скрининг</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container container-wide">
        <header class="header">
            <a href="index.html" class="back-link">← Назад</a>
            <img src="Sechenov Logo color horizontal.png" alt="Сеченовский Университет" class="logo-img">
        </header>

        <h1>Анализ для врача</h1>
        <p class="subtitle">Введите лабораторные показатели пациента</p>

        <form id="doctorForm">
            <div class="form-grid">
                <div class="form-group">
                    <label for="sex">Пол *</label>
                    <select id="sex" required>
                        <option value="">— выберите —</option>
                        <option value="F">Женский</option>
                        <option value="M">Мужской</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="age">Возраст (лет) *</label>
                    <input type="number" id="age" required min="1" max="120" placeholder="34">
                </div>

                <div class="form-group">
                    <label for="hemoglobin">Гемоглобин (г/л) *</label>
                    <input type="number" id="hemoglobin" required step="0.1" placeholder="105">
                </div>

                <div class="form-group">
                    <label for="mcv">MCV (фл)</label>
                    <input type="number" id="mcv" step="0.1" placeholder="72">
                </div>

                <div class="form-group">
                    <label for="ferritin">Ферритин (нг/мл)</label>
                    <input type="number" id="ferritin" step="0.1" placeholder="8">
                </div>

                <div class="form-group">
                    <label for="stfr">sTfR (мг/л)</label>
                    <input type="number" id="stfr" step="0.1" placeholder="5.2">
                </div>

                <div class="form-group">
                    <label for="tsat">TSAT (%)</label>
                    <input type="number" id="tsat" step="0.1" placeholder="12">
                </div>

                <div class="form-group">
                    <label for="b12">Витамин B12 (пг/мл)</label>
                    <input type="number" id="b12" step="0.1" placeholder="350">
                </div>

                <div class="form-group">
                    <label for="crp">СРБ (мг/л)</label>
                    <input type="number" id="crp" step="0.1" placeholder="2.1">
                </div>

                <div class="form-group">
                    <label for="folate">Фолаты (нг/мл)</label>
                    <input type="number" id="folate" step="0.1" placeholder="5.0">
                </div>
            </div>

            <button type="submit" class="btn btn-doctor">Анализировать</button>
        </form>

        <div id="result" class="result hidden"></div>

        <p class="disclaimer">
            Результаты носят информационный характер и требуют верификации врачом.
        </p>
    </div>

    <script src="script.js"></script>
</body>
</html>
